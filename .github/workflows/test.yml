name: Stage 0 regression tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install --yes sqlite3

      - name: Install dependencies
        run: npm ci

      - name: Run backup and Worker regression tests
        run: npm test

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --outdir /tmp/shopbgremover-worker-build
