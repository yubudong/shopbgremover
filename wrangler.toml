name = "shopbgremover-api"
main = "worker/index.js"
compatibility_date = "2026-07-23"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.05

[[d1_databases]]
binding = "DB"
database_name = "shopbgremover-db"
database_id = "f9c622b0-9360-48c1-a2a6-36e51b93d3de"
migrations_dir = "worker/migrations"

[[r2_buckets]]
binding = "INPAINT_OBJECTS"
bucket_name = "shopbgremover-inpaint-private"

[vars]
FRONTEND_URL = "https://www.shopbgremover.com"
NEXTAUTH_URL = "https://www.shopbgremover.com"
ADMIN_EMAILS = "yubudong2023@gmail.com"
INPAINT_MODE = "off"

[triggers]
crons = ["17 * * * *"]

[[queues.producers]]
binding = "INPAINT_QUEUE"
queue = "shopbgremover-inpaint"

[[queues.consumers]]
queue = "shopbgremover-inpaint"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3
dead_letter_queue = "shopbgremover-inpaint-dlq"
max_concurrency = 2
retry_delay = 2

[[routes]]
pattern = "api.shopbgremover.com/*"
zone_name = "shopbgremover.com"
