<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PayPal 沙盒测试说明</title>
  <style>
    body { font: 16px/1.65 system-ui, sans-serif; max-width: 760px; margin: 48px auto; padding: 0 20px; color: #172033; }
    main { border: 1px solid #dce3ef; border-radius: 18px; padding: 28px; box-shadow: 0 16px 40px rgba(23,32,51,.08); }
    code { background: #f2f5fa; border-radius: 6px; padding: 3px 7px; }
    .safe { color: #087f5b; font-weight: 700; }
    .warning { color: #b45309; }
  </style>
</head>
<body>
  <main>
    <h1>PayPal 沙盒支付测试</h1>
    <p class="safe">这个旧测试页已停用，不会再连接正式 API，也不会创建生产订单。</p>
    <p>请在项目终端使用隔离的本机沙盒流程：</p>
    <ol>
      <li><code>npm run paypal:sandbox:setup</code></li>
      <li><code>npm run paypal:sandbox:check</code></li>
      <li><code>npm run paypal:sandbox:run</code></li>
    </ol>
    <p class="warning">只允许使用 PayPal Developer Dashboard 提供的 Sandbox Business 与 Sandbox Personal 账号。不要在此流程输入真实买家账号或真实银行卡。</p>
  </main>
</body>
</html>
