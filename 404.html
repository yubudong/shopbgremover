<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found – ShopBG Remover</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:#0c0c0e;color:#e8e8e6;line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{max-width:520px;padding:48px 24px;text-align:center}
.code{font-size:96px;font-weight:800;letter-spacing:-.06em;line-height:1;background:linear-gradient(135deg,#6c5ce7,#a29bfe);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:16px}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-bottom:14px}
p{font-size:16px;color:#9a9a96;margin-bottom:32px}
.cta{display:inline-flex;align-items:center;gap:8px;background:#6c5ce7;color:#fff;font-size:14px;font-weight:600;padding:13px 28px;border-radius:100px;text-decoration:none;transition:all .15s}
.cta:hover{background:#a29bfe;color:#0c0c0e}
.langs{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:32px;font-size:12px}
.langs a{color:#6B7280;text-decoration:none;padding:4px 10px;border:1px solid rgba(255,255,255,0.08);border-radius:6px;transition:all 0.2s}
.langs a:hover{color:#fff;border-color:rgba(255,255,255,0.2)}
</style>
</head>
<body>
<div class="container">
  <div class="code">404</div>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist or has been moved. Try the homepage in your language:</p>
  <a class="cta" href="/">← Back to homepage</a>
  <div class="langs" aria-label="Homepage in your language">
    <a href="/">English</a>
    <a href="/es/">Español</a>
    <a href="/pt-br/">Português</a>
    <a href="/de/">Deutsch</a>
    <a href="/fr/">Français</a>
  </div>
</div>
</body>
</html>
