<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>推荐奖励审核 · ShopBG Remover</title>
  <link rel="icon" href="/favicon.svg">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172033;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    header{height:64px;background:#111c2f;color:#fff;padding:0 28px;display:flex;align-items:center;justify-content:space-between}
    header a{color:#b9c5d8;text-decoration:none}.brand{font-size:18px;font-weight:800}
    main{width:min(1180px,calc(100% - 32px));margin:32px auto 70px}h1{margin:0 0 8px}.sub{margin:0 0 24px;color:#64748b}
    .panel{background:#fff;border:1px solid #dfe5ee;border-radius:14px;padding:20px;box-shadow:0 8px 26px rgba(24,39,75,.05)}
    .toolbar{display:flex;gap:10px;margin-bottom:14px}select,button{border:1px solid #cbd5e1;border-radius:8px;padding:9px 12px;font:inherit}
    button{border:0;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}button.reject{background:#fee2e2;color:#991b1b}button:disabled{opacity:.5}
    .table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:970px;font-size:13px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #e8edf4;vertical-align:top}th{font-size:11px;color:#64748b;text-transform:uppercase}
    .score{font-weight:900;color:#b45309}.reason{display:inline-block;margin:2px 4px 2px 0;padding:3px 7px;border-radius:999px;background:#fff7ed;color:#9a3412}
    .actions{display:flex;gap:6px}.empty{padding:36px;text-align:center;color:#64748b}.error{color:#b91c1c;margin-bottom:12px}
    dialog{width:min(560px,calc(100% - 32px));border:0;border-radius:16px;padding:0;box-shadow:0 24px 80px rgba(15,23,42,.3)}
    dialog::backdrop{background:rgba(15,23,42,.55)}.dialog-body{padding:24px}.dialog-body h2{margin:0 0 8px}.dialog-impact{margin:0 0 18px;color:#475569;line-height:1.55}
    .dialog-field{margin-bottom:16px}.dialog-field label{display:block;margin-bottom:7px;font-size:13px;font-weight:800}.dialog-field textarea{width:100%;min-height:120px;resize:vertical;border:1px solid #cbd5e1;border-radius:9px;padding:10px 12px;font:inherit}
    .dialog-confirm{display:flex;gap:9px;align-items:flex-start;margin:0 0 16px;color:#334155;font-size:13px;line-height:1.45}.dialog-confirm input{margin-top:3px}.dialog-error{color:#b91c1c;margin:0 0 14px}
    .dialog-actions{display:flex;justify-content:flex-end;gap:8px}.dialog-actions .secondary{background:#e8eef8;color:#20304a}.dialog-actions .danger{background:#b91c1c}
  </style>
</head>
<body>
  <header><span class="brand">ShopBG Remover · 推荐奖励审核</span><a href="/admin">返回管理总览</a></header>
  <main>
    <h1>卡密邀请风险审核</h1>
    <p class="sub" id="authStatus">正在验证管理员身份…</p>
    <p class="error" id="error" hidden></p>
    <section class="panel">
      <div class="toolbar">
        <select id="status"><option value="pending">待审核</option><option value="approved">已批准</option><option value="rejected">已拒绝</option></select>
        <button id="refresh" type="button">刷新</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>时间/订单</th><th>推荐人</th><th>被推荐用户</th><th>基础积分</th><th>待发奖励</th><th>风险</th><th>状态/备注</th><th>操作</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty" hidden>当前没有记录。</div>
      </div>
    </section>
    <dialog id="reviewDialog" aria-labelledby="reviewDialogTitle">
      <form id="reviewForm" class="dialog-body">
        <h2 id="reviewDialogTitle">审核推荐奖励</h2>
        <p class="dialog-impact" id="reviewDialogImpact"></p>
        <div class="dialog-field">
          <label for="reviewNote" id="reviewNoteLabel">审核说明（3–500 字符）</label>
          <textarea id="reviewNote" minlength="3" maxlength="500" required></textarea>
        </div>
        <label class="dialog-confirm">
          <input id="reviewConfirm" type="checkbox" required>
          <span id="reviewConfirmText"></span>
        </label>
        <p class="dialog-error" id="reviewDialogError" hidden></p>
        <div class="dialog-actions">
          <button class="secondary" id="reviewCancel" type="button">取消</button>
          <button id="reviewSubmit" type="submit">确认提交</button>
        </div>
      </form>
    </dialog>
  </main>
  <script>
    const API = 'https://api.shopbgremover.com';
    const reasonLabels = {
      same_device: '同一设备',
      same_ip_recent_binding: '同 IP 且短期绑定',
      referrer_voucher_burst: '短时大量兑换',
    };
    async function api(path, init = {}) {
      const response = await fetch(`${API}${path}`, {
        credentials: 'include',
        ...init,
        headers: { 'Content-Type': 'application/json', ...(init.headers || {}) },
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
      return data;
    }
    function cell(row, text) {
      const value = document.createElement('td');
      value.textContent = text;
      row.append(value);
      return value;
    }
    let activeReviewAction = null;
    function openReviewDialog(id, decision, button) {
      activeReviewAction = { id, decision, button };
      const approving = decision === 'approve';
      document.getElementById('reviewDialogTitle').textContent = approving ? '批准推荐奖励审核' : '拒绝推荐奖励审核';
      document.getElementById('reviewDialogImpact').textContent = approving
        ? '批准后，两项奖励只会进入 7 天观察期，不会立即变为可用积分。'
        : '拒绝后，本次首充赠送和推荐奖励都不会发放。';
      document.getElementById('reviewNoteLabel').textContent = approving ? '批准说明（3–500 字符）' : '拒绝原因（3–500 字符）';
      document.getElementById('reviewConfirmText').textContent = approving
        ? '我已核对账号、订单和风险原因，确认批准并进入 7 天观察期。'
        : '我已核对账号、订单和风险原因，确认拒绝且不发放奖励。';
      document.getElementById('reviewSubmit').className = approving ? '' : 'danger';
      document.getElementById('reviewNote').value = '';
      document.getElementById('reviewConfirm').checked = false;
      document.getElementById('reviewDialogError').hidden = true;
      document.getElementById('reviewDialog').showModal();
      document.getElementById('reviewNote').focus();
    }
    document.getElementById('reviewCancel').addEventListener('click', () => {
      document.getElementById('reviewDialog').close();
      activeReviewAction = null;
    });
    document.getElementById('reviewForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!activeReviewAction) return;
      const normalized = document.getElementById('reviewNote').value.trim();
      const dialogError = document.getElementById('reviewDialogError');
      if (normalized.length < 3 || normalized.length > 500) {
        dialogError.textContent = '审核说明必须为 3–500 个字符。';
        dialogError.hidden = false;
        return;
      }
      const { id, decision, button } = activeReviewAction;
      const submit = document.getElementById('reviewSubmit');
      submit.disabled = true;
      button.disabled = true;
      try {
        await api(`/api/admin/referral-reviews/${encodeURIComponent(id)}/${decision}`, {
          method: 'POST',
          body: JSON.stringify({ note: normalized }),
        });
        document.getElementById('reviewDialog').close();
        activeReviewAction = null;
        await load();
      } catch (error) {
        dialogError.textContent = error.message;
        dialogError.hidden = false;
        button.disabled = false;
      } finally {
        submit.disabled = false;
      }
    });
    async function load() {
      const error = document.getElementById('error');
      error.hidden = true;
      try {
        const status = document.getElementById('status').value;
        const data = await api(`/api/admin/referral-reviews?status=${encodeURIComponent(status)}`);
        document.getElementById('authStatus').textContent = '仅显示脱敏账号和风险原因，不显示原始 IP 或设备标识。';
        const rows = document.getElementById('rows');
        rows.replaceChildren();
        document.getElementById('empty').hidden = data.reviews.length !== 0;
        for (const review of data.reviews) {
          const row = document.createElement('tr');
          cell(row, `${new Date(Number(review.created_at) * 1000).toLocaleString('zh-CN')}\n${review.order_id}`);
          cell(row, review.referrer_email || '—');
          cell(row, review.referred_email || '—');
          cell(row, String(review.base_credits));
          cell(row, `被邀请人 +${review.pending_promotion_credits}\n推荐人 +${review.pending_referral_credits}`);
          const risk = cell(row, `${review.risk_score} 分`);
          risk.className = 'score';
          for (const reason of review.risk_reasons || []) {
            const badge = document.createElement('span');
            badge.className = 'reason';
            badge.textContent = reasonLabels[reason] || reason;
            risk.append(document.createElement('br'), badge);
          }
          cell(row, `${review.status}${review.review_note ? `\n${review.review_note}` : ''}`);
          const actions = cell(row, '');
          actions.className = 'actions';
          if (review.status === 'pending') {
            const approve = document.createElement('button');
            approve.textContent = '批准';
            approve.addEventListener('click', () => openReviewDialog(review.id, 'approve', approve));
            const reject = document.createElement('button');
            reject.textContent = '拒绝';
            reject.className = 'reject';
            reject.addEventListener('click', () => openReviewDialog(review.id, 'reject', reject));
            actions.append(approve, reject);
          }
          rows.append(row);
        }
      } catch (cause) {
        document.getElementById('authStatus').textContent = '无法加载审核队列。';
        error.textContent = cause.message;
        error.hidden = false;
      }
    }
    document.getElementById('refresh').addEventListener('click', load);
    document.getElementById('status').addEventListener('change', load);
    load();
  </script>
</body>
</html>
